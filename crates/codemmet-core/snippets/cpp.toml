# Builtin C++ snippet pack. Inherits the C pack (profile `inherits = "c"`):
# every C trigger (fn, fori, if, switch, pr, malloc, ...) is available here,
# and this pack only adds what differs or overrides what C got wrong for C++.
# Overrides replace the WHOLE snippet (params, scope, variants included);
# nothing is merged field-by-field.
#
# Deliberately inherited unchanged: `pr`/`prf` stay printf (valid C++); use
# `cout` for iostream printing. C++ methods share function syntax, so `fn`
# needs no type-body variant.
#
# Intentional trigger-prefix overlaps (longest trigger wins during resolution):
#   fn / fori / fore / free — safe: no trigger is a prefix of another.
#   class / case            — safe: not prefixes of each other.
#   us(ing) / uptr / sptr   — safe: no shared prefixes.

[meta]
language = "cpp"

[snippets.class]
description = "class definition"
params = [{ name = "name", kind = "ident", default = "Name" }]
scope = "type-body"
body = '''
class ${name} {
public:
	${child}
};
'''

[snippets.struct]
description = "struct definition (overrides C's typedef form)"
params = [{ name = "name", kind = "ident", default = "Name" }]
scope = "type-body"
body = '''
struct ${name} {
	${child}
};
'''

[snippets.enum]
description = "scoped enum (overrides C's typedef form)"
params = [{ name = "name", kind = "ident", default = "Name" }]
scope = "type-body"
body = '''
enum class ${name} {
	${child}
};
'''

[snippets.fore]
description = "range-based for loop"
params = [{ name = "var", kind = "ident", default = "item" }]
scope = "loop"
body = '''
for (const auto& ${var} : ${1:container}) {
	${child}
}
'''

[snippets.try]
description = "try/catch block"
scope = "try-body"
body = '''
try {
	${child}
} catch (const ${1:std::exception}& ${2:e}) {
	$0
}
'''

[snippets.cout]
description = "std::cout line"
requires = ["<iostream>"]
body = '''
std::cout << $0 << '\n';
'''

[snippets.ns]
description = "namespace block"
params = [{ name = "name", kind = "ident", default = "ns" }]
body = '''
namespace ${name} {

${child}

}  // namespace ${name}
'''

[snippets.tpl]
description = "template parameter list (prefix for a declaration)"
body = '''
template <typename ${1:T}>$0
'''

[snippets.vec]
description = "std::vector variable"
requires = ["<vector>"]
body = '''
std::vector<${1:int}> ${2:values};$0
'''

[snippets.map]
description = "std::unordered_map variable"
requires = ["<unordered_map>", "<string>"]
body = '''
std::unordered_map<${1:std::string}, ${2:int}> ${3:map};$0
'''

[snippets.uptr]
description = "std::make_unique binding"
requires = ["<memory>"]
body = '''
auto ${1:ptr} = std::make_unique<${2:Type}>($3);$0
'''

[snippets.sptr]
description = "std::make_shared binding"
requires = ["<memory>"]
body = '''
auto ${1:ptr} = std::make_shared<${2:Type}>($3);$0
'''

[snippets.using]
description = "using type alias"
params = [{ name = "name", kind = "ident", default = "Alias" }]
body = '''
using ${name} = $0;
'''

[snippets.lam]
description = "lambda expression"
body = '''
[$1]($2) { $0 }
'''

[snippets.hclass]
description = "include-guarded class for a header (composite)"
params = [{ name = "name", kind = "ident", default = "Name" }]
expands = "guard>class:${name}"

[snippets.nsclass]
description = "namespaced class (composite)"
params = [{ name = "name", kind = "ident", default = "Name" }]
expands = "ns>class:${name}"

[snippets.mcls]
description = "a class split across a .hpp header and .cpp source (multi-file)"
params = [{ name = "name", kind = "ident", default = "Widget" }]

[snippets.mcls.files.header]
path = "${name}.hpp"
on_exists = "create"
primary = true
body = '''
#pragma once

class ${name} {
public:
    ${name}();
    $0
};
'''

[snippets.mcls.files.source]
path = "${name}.cpp"
on_exists = "create"
body = '''
#include "${name}.hpp"

${name}::${name}() {
}
'''

[snippets.mmethod]
description = "declare a method in the current header's class, define it in the .cpp (multi-file)"
params = [
    { name = "name", kind = "ident", default = "method" },
    { name = "cls", kind = "ident", default = "Widget" },
]

[snippets.mmethod.files.decl]
target = "self"
on_exists = "inject"
into = "${cls}"
body = "void ${name}();"

[snippets.mmethod.files.def]
target = ".cpp"
on_exists = "append"
primary = true
body = '''
void ${cls}::${name}() {
    $0
}
'''

[snippets.mns]
description = "a class inside a namespace, split across .hpp and .cpp (multi-file)"
params = [
    { name = "ns", kind = "ident", default = "app" },
    { name = "name", kind = "ident", default = "Widget" },
]

[snippets.mns.files.header]
path = "${name}.hpp"
on_exists = "create"
primary = true
body = '''
#pragma once

namespace ${ns} {

class ${name} {
public:
    ${name}();
    $0
};

}  // namespace ${ns}
'''

[snippets.mns.files.source]
path = "${name}.cpp"
on_exists = "create"
body = '''
#include "${name}.hpp"

namespace ${ns} {

${name}::${name}() {
}

}  // namespace ${ns}
'''

[snippets.itest]
description = "a test file (multi-file)"
params = [{ name = "name", kind = "ident", default = "widget" }]

[snippets.itest.files.test]
path = "${name}_test.cpp"
on_exists = "create"
primary = true
body = '''
TEST(${name}, ${1:works}) {
    $0
}
'''

# --- Data-driven tests (SOURCE_COLLECTIONS_PLAN.md) -------------------------
# GoogleTest shapes; `tfn` overrides the C pack's assert-based one.

[snippets.tfn]
description = "GoogleTest TEST calling a function (data-driven: tfn*@src.fns, public by default)"
filter = "vis=public?!test"
requires = ["<gtest/gtest.h>"]
scope = "fn-body"
# `${value.overload}` is the overload's ordinal (`1`, `2`, …) and empty for a
# function with one definition, so overloads get distinct test names
# (`Works1`, `Works2`) and everything else stays `Works`.
body = '''
TEST(${value|pascal}Test, Works${value.overload}) {
	EXPECT_EQ(${value}(${value.args}), ${1:expected});
}
'''

[snippets.tmeth]
description = "GoogleTest TEST calling a method (data-driven: tmeth*@src.Type.methods; statics via Type::, constructors construct)"
filter = "vis=public"
requires = ["<gtest/gtest.h>"]
scope = "fn-body"
body = '''
TEST(${value.owner}Test, ${value|pascal}${value.overload}) {
	${value.owner} subject$1;
	EXPECT_EQ(subject.${value}(${value.args}), ${2:expected});
}
'''

# A default constructor is `Point subject;` — `Point subject();` would
# declare a function.
[[snippets.tmeth.variants]]
when = "ctor?!params"
body = '''
TEST(${value.owner}Test, Constructs${value.overload}) {
	${value.owner} subject;
	$0
}
'''

[[snippets.tmeth.variants]]
when = "ctor"
body = '''
TEST(${value.owner}Test, Constructs${value.overload}) {
	${value.owner} subject(${value.args});
	$0
}
'''

[[snippets.tmeth.variants]]
when = "static"
body = '''
TEST(${value.owner}Test, ${value|pascal}${value.overload}) {
	EXPECT_EQ(${value.owner}::${value}(${value.args}), ${1:expected});
}
'''

[snippets.tfile]
description = "write <source>_test.cpp beside the --source file with a GoogleTest per public fn/method; re-running adds the missing ones (multi-file)"

[snippets.tfile.files.test]
path = "${src.dir}/${src.stem}_test.cpp"
on_exists = "append"
on_create = '#include "${src.module}"'
primary = true
expands = "tfn*@src.fns+tmeth*@src.methods"

[snippets.stub]
description = "override stub from a base class's virtual (stub*@src.Shape.methods writes the pure virtuals; ?all for every virtual)"
filter = "required"
scope = "fn-body"
body = '''
${value.decl:void name()} override {
	${child}
}
'''

# `|native` additions over the inherited C map: owning standard-library
# types for strings, sequences, sets, maps, and optionals (C maps strings to
# `const char*`; here they become `std::string`).
[maps.native]
String = "std::string"
str = "std::string"
"&str" = "std::string"
string = "std::string"
"char*" = "std::string"
"const char*" = "std::string"
"Vec<u8>" = "std::vector<uint8_t>"
"Vec<*>" = "std::vector<*>"
"HashSet<*>" = "std::unordered_set<*>"
"BTreeSet<*>" = "std::set<*>"
"HashMap<*, *>" = "std::unordered_map<*, *>"
"BTreeMap<*, *>" = "std::map<*, *>"
"Option<*>" = "std::optional<*>"
"Box<*>" = "std::unique_ptr<*>"
bytes = "std::vector<uint8_t>"
"list[*]" = "std::vector<*>"
"set[*]" = "std::unordered_set<*>"
"dict[*, *]" = "std::unordered_map<*, *>"
"Optional[*]" = "std::optional<*>"
"* | None" = "std::optional<*>"
Uint8Array = "std::vector<uint8_t>"
"*[]" = "std::vector<*>"
"Array<*>" = "std::vector<*>"
"Record<string, *>" = "std::unordered_map<std::string, *>"
"Map<*, *>" = "std::unordered_map<*, *>"
"Set<*>" = "std::unordered_set<*>"
"* | null" = "std::optional<*>"
"* | undefined" = "std::optional<*>"
"[]byte" = "std::vector<uint8_t>"
"[]*" = "std::vector<*>"
"map[*]*" = "std::unordered_map<*, *>"
