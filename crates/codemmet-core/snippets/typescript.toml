# Builtin TypeScript snippet pack. Inherits the JavaScript pack (profile
# `inherits = "javascript"`): every JS trigger (arrow, class, fore, imp,
# try, ...) is available here; this pack adds TS-only constructs and
# overrides `fn`/`afn` with typed signatures.
# Overrides replace the WHOLE snippet — variants are NOT merged — so the
# typed `fn`/`afn` overrides re-declare their type-body method variants.
#
# Intentional trigger-prefix overlaps (longest trigger wins during resolution):
#   fn / fng            — `fng` wins for the exact word; a plain fn whose name
#                         starts with "g" needs `fn:g...`.
#   imp / impd / impt   — `impd`/`impt` win for their exact words; `imp` binds
#                         explicitly only (kind = "str", inherited note).
#   int / typ / enum    — shadow prefixes of real keywords (`interface`,
#                         `type`, `enum`); completion is offer-only so a
#                         half-typed keyword merely offers a nonsense item.

[meta]
language = "typescript"

[snippets.int]
description = "interface definition"
params = [{ name = "name", kind = "ident", default = "Name" }]
scope = "type-body"
body = '''
interface ${name} {
	${child}
}
'''

[snippets.typ]
description = "type alias"
params = [{ name = "name", kind = "ident", default = "Name" }]
body = '''
type ${name} = $0;
'''

[snippets.enum]
description = "enum definition"
params = [{ name = "name", kind = "ident", default = "Name" }]
scope = "type-body"
body = '''
enum ${name} {
	${child}
}
'''

[snippets.variant]
description = "enum member"
# Nest inside `enum` (`enum:Color>variant*3`). `${value}` binds to a
# data-driven repeat item, so `variant*@Src` fills one member per item; with
# no data it falls back to the `Name` tabstop.
body = '''
${value:Name},
'''

[snippets.fn]
description = "typed function declaration (overrides JS)"
params = [{ name = "name", kind = "ident", default = "name" }]
scope = "fn-body"
body = '''
function ${name}($1): ${2:void} {
	${child}
}
'''

[[snippets.fn.variants]]
context = "type-body"
body = '''
${name}($1): ${2:void} {
	${child}
}
'''

[snippets.afn]
description = "typed async function declaration (overrides JS)"
params = [{ name = "name", kind = "ident", default = "name" }]
scope = "fn-body"
body = '''
async function ${name}($1): Promise<${2:void}> {
	${child}
}
'''

[[snippets.afn.variants]]
context = "type-body"
body = '''
async ${name}($1): Promise<${2:void}> {
	${child}
}
'''

[snippets.fng]
description = "generic function declaration"
params = [{ name = "name", kind = "ident", default = "name" }]
scope = "fn-body"
body = '''
function ${name}<${1:T}>($2): ${3:T} {
	${child}
}
'''

[snippets.asrt]
description = "as-type assertion"
body = '''
${1:value} as $0
'''

[snippets.impt]
description = "type-only import"
params = [{ name = "module", default = "module" }]
body = '''
import type { $1 } from "${module}";$0
'''

[snippets.field]
description = "object/interface field"
# `${value}` / `${value.type}` bind to a data-driven repeat item: an
# interface's members fill `field*@Point` (name + declared type). With no data
# both fall back to tabstops. `|native` maps a foreign type spelling (a Rust
# or Python `--source`) to TypeScript's; a TypeScript type passes through.
body = '''
${value:name}: ${value.type|native:type};
'''

[snippets.classc]
description = "class with a constructor (composite)"
params = [{ name = "name", kind = "ident", default = "Name" }]
expands = "class:${name}>ctor"

[snippets.itest]
description = "a .test.ts file (multi-file)"
params = [{ name = "name", kind = "ident", default = "widget" }]

[snippets.itest.files.test]
path = "${name}.test.ts"
on_exists = "create"
primary = true
body = '''
test("${name}", () => {
    $0
});
'''

# --- Data-driven tests (SOURCE_COLLECTIONS_PLAN.md) -------------------------
# `tfn`/`tmeth` are inherited from JavaScript; the test-file scaffold needs its
# own extension.

[snippets.tfile]
description = "create <source>.test.ts beside the --source file with a Jest test per exported fn/method (multi-file)"

[snippets.tfile.files.test]
path = "${src.dir}/${src.stem}.test.ts"
on_exists = "create"
primary = true
expands = "(timport>tname*@src.fns?vis=public+tname*@src.types?vis=public)+tfn*@src.fns+tmeth*@src.methods"

[snippets.sqltable]
description = "CREATE TABLE statement; `sqltable:Point>sqlcol*` writes a column per field"
params = [{ name = "name", kind = "ident", default = "Table" }]
body = '''
CREATE TABLE ${name|snake} (
	${child}
);
'''

[snippets.sqlcol]
description = "column from an interface field: snake_case name and the `|sql` type (`sqlcol*@Point`)"
body = '''
${value|snake:column} ${value.type|sql:TEXT},
'''

[[snippets.sqlcol.variants]]
when = "last"
body = '''
${value|snake:column} ${value.type|sql:TEXT}
'''

# `|sql`: a column type for a field's declared type — what `sqlcol` writes.
# Integers become INTEGER, floats REAL, booleans BOOLEAN, text TEXT, byte
# strings BLOB; an optional wrapper is unwrapped (nullability is the column's
# business); anything else falls back to TEXT via the `*` catch-all.
[maps.sql]
number = "REAL"
bigint = "INTEGER"
boolean = "BOOLEAN"
string = "TEXT"
Uint8Array = "BLOB"
Date = "TEXT"
"* | null" = "*"
"* | undefined" = "*"
"*" = "TEXT"
