# Builtin JavaScript snippet pack. The TypeScript pack inherits every
# trigger here.
#
# Intentional trigger-prefix overlaps (longest trigger wins during resolution):
#   fori / forin        — `forin` wins for the exact word; a counted loop whose
#                         variable starts with "n" needs `fori:n...`.
#   exp / expd          — `expd` wins for the exact word. `exp` binds its name
#                         explicitly only (kind = "str"), so typing the real
#                         keyword `export` never half-matches as `exp` + "ort".
#   imp / impd          — `impd` wins for the exact word; both bind their
#                         module param explicitly only (kind = "str"), so the
#                         keyword `import` never half-matches either.
#   pr / prd / prom     — safe: `pr` has no params; `prd`/`prom` win exact.
#   el / elif           — safe: `el` has no params.
#   jsonp / jsons       — safe: not prefixes of each other.
# `class`/`get`/`set` shadow real keywords; completion is offer-only so this
# is safe (same rationale as `str` in the Python pack).

[meta]
language = "javascript"

[snippets.fn]
description = "function declaration"
params = [{ name = "name", kind = "ident", default = "name" }]
scope = "fn-body"
body = '''
function ${name}($1) {
	${child}
}
'''

[[snippets.fn.variants]]
context = "type-body"
body = '''
${name}($1) {
	${child}
}
'''

[snippets.afn]
description = "async function declaration"
params = [{ name = "name", kind = "ident", default = "name" }]
scope = "fn-body"
body = '''
async function ${name}($1) {
	${child}
}
'''

[[snippets.afn.variants]]
context = "type-body"
body = '''
async ${name}($1) {
	${child}
}
'''

[snippets.arrow]
description = "arrow function bound to a const"
params = [{ name = "name", kind = "ident", default = "handler" }]
scope = "fn-body"
body = '''
const ${name} = ($1) => {
	${child}
};
'''

[snippets.fori]
description = "for loop over integer range"
params = [{ name = "var", kind = "ident", default = "i" }, { name = "end", kind = "int", default = "10" }]
scope = "loop"
body = '''
for (let ${var} = 0; ${var} < ${end}; ${var}++) {
	${child}
}
'''

[snippets.fore]
description = "for...of loop"
params = [{ name = "var", kind = "ident", default = "item" }]
scope = "loop"
body = '''
for (const ${var} of ${1:items}) {
	${child}
}
'''

[snippets.forin]
description = "for...in loop over object keys"
params = [{ name = "var", kind = "ident", default = "key" }]
scope = "loop"
body = '''
for (const ${var} in ${1:object}) {
	${child}
}
'''

[snippets.while]
description = "while loop"
scope = "loop"
body = '''
while (${1:condition}) {
	${child}
}
'''

[snippets.if]
description = "if block"
scope = "conditional"
body = '''
if (${1:condition}) {
	${child}
}
'''

[snippets.el]
description = "else block"
scope = "conditional"
body = '''
else {
	${child}
}
'''

[snippets.elif]
description = "else-if block"
scope = "conditional"
body = '''
else if (${1:condition}) {
	${child}
}
'''

[snippets.switch]
description = "switch statement"
params = [{ name = "expr", kind = "ident", default = "value" }]
scope = "match-body"
body = '''
switch (${expr}) {
	${child}
}
'''

[snippets.case]
description = "case clause with break"
# `${value}` binds to a data-driven repeat item (`switch:c>case*@Color` writes
# one case per enum member — TypeScript inherits this); with no data it falls
# back to the placeholder.
body = '''
case ${value:value}:
	${child}
	break;
'''

[snippets.ifchain]
description = "if / else if chain, one branch per item (`ifchain:c*@Color`)"
params = [{ name = "expr", kind = "ident", default = "value" }]
scope = "conditional"
# Each copy after the first joins its `else if` onto the previous `}`.
body = '''
${join} else if (${expr} === ${value:variant}) {
	${child}
}
'''

[[snippets.ifchain.variants]]
when = "first"
body = '''
if (${expr} === ${value:variant}) {
	${child}
}
'''

[snippets.default]
description = "default clause"
body = '''
default:
	${child}
'''

[snippets.class]
description = "class definition"
params = [{ name = "name", kind = "ident", default = "Name" }]
scope = "type-body"
body = '''
class ${name} {
	${child}
}
'''

[snippets.variant]
description = "frozen-object enum member"
# JavaScript has no enum keyword; the idiom is a frozen object of string
# constants. Nest inside such an object and fill it with `variant*@Src` —
# `${value}` binds to a data-driven repeat item; with no data both fall back
# to the `NAME` tabstop.
body = '''
${value:NAME}: "${value:NAME}",
'''

[snippets.ctor]
description = "constructor method"
scope = "fn-body"
body = '''
constructor($1) {
	${child}
}
'''

[snippets.get]
description = "getter backed by a private-by-convention field"
params = [{ name = "name", kind = "ident", default = "value" }]
body = '''
get ${name}() {
	return this._${name};$0
}
'''

[snippets.set]
description = "setter backed by a private-by-convention field"
params = [{ name = "name", kind = "ident", default = "value" }]
body = '''
set ${name}(value) {
	this._${name} = value;$0
}
'''

[snippets.ret]
description = "return statement"
body = '''
return $0;
'''

[snippets.pr]
description = "console.log call"
body = '''
console.log($0);
'''

[snippets.prd]
description = "debug-log with object-shorthand label"
body = '''
console.log({ $0 });
'''

[snippets.imp]
description = "default import"
params = [{ name = "module", default = "module" }]
body = '''
import ${1:name} from "${module}";$0
'''

[snippets.impd]
description = "destructured (named) import"
params = [{ name = "module", default = "module" }]
body = '''
import { $1 } from "${module}";$0
'''

[snippets.exp]
description = "export a const binding"
params = [{ name = "name", default = "name" }]
body = '''
export const ${name} = $0;
'''

[snippets.expd]
description = "export default"
body = '''
export default $0;
'''

[snippets.try]
description = "try/catch block"
scope = "try-body"
body = '''
try {
	${child}
} catch (${1:err}) {
	$0
}
'''

[snippets.test]
description = "test case (jest/vitest style)"
params = [{ name = "name", kind = "ident", default = "works" }]
scope = "fn-body"
body = '''
test("${name}", () => {
	${child}
});
'''

[snippets.aeq]
description = "equality expectation"
body = '''
expect(${1:actual}).toBe($0);
'''

[snippets.doc]
description = "JSDoc comment line"
body = '''
/** $0 */
'''

[snippets.todo]
description = "TODO comment"
body = '''
// TODO: $0
'''

[snippets.jsonp]
description = "JSON.parse expression"
body = '''
JSON.parse($0)
'''

[snippets.jsons]
description = "JSON.stringify expression"
body = '''
JSON.stringify($0)
'''

[snippets.prom]
description = "new Promise with executor"
scope = "fn-body"
body = '''
new Promise((resolve, reject) => {
	${child}
})
'''

[snippets.aw]
description = "await statement"
body = '''
await $0;
'''

[snippets.classc]
description = "class with a constructor (composite)"
params = [{ name = "name", kind = "ident", default = "Name" }]
expands = "class:${name}>ctor"

[snippets.itest]
description = "a .test.js file (multi-file)"
params = [{ name = "name", kind = "ident", default = "widget" }]

[snippets.itest.files.test]
path = "${name}.test.js"
on_exists = "create"
primary = true
body = '''
test("${name}", () => {
    $0
});
'''

# --- Data-driven tests (SOURCE_COLLECTIONS_PLAN.md) -------------------------
# Jest shapes (TypeScript inherits them). `tfn*@src.fns` /
# `tmeth*@src.Point.methods` with a `--source` file.

[snippets.tfn]
description = "Jest test calling a function (data-driven: tfn*@src.fns, exported non-async by default)"
filter = "vis=public?!test?!async"
scope = "fn-body"
body = '''
test("${value} works", () => {
	expect(${value}(${value.args})).toBe(${1:expected});
});
'''

[snippets.tmeth]
description = "Jest test calling a method (data-driven: tmeth*@src.Type.methods; statics via the class, the constructor constructs)"
filter = "vis=public?!async"
scope = "fn-body"
body = '''
test("${value.owner}.${value} works", () => {
	const subject = new ${value.owner}($1);
	expect(subject.${value}(${value.args})).toBe(${2:expected});
});
'''

[[snippets.tmeth.variants]]
when = "ctor"
body = '''
test("${value.owner} constructs", () => {
	const subject = new ${value.owner}(${value.args});
	expect(subject).toBeDefined();
});
'''

[[snippets.tmeth.variants]]
when = "static"
body = '''
test("${value.owner}.${value} works", () => {
	expect(${value.owner}.${value}(${value.args})).toBe(${1:expected});
});
'''

# The test file's header: a named import of the source's exported functions
# and types, one per line (`timport>tname*@src.fns?vis=public+tname*@src.types?vis=public`),
# so the `tfn`/`tmeth` bodies can call them bare. `${src.module}` is the
# source's import path (`./geometry`).
[snippets.timport]
description = "named import from the --source module (data-driven: timport>tname*@src.fns?vis=public)"
body = '''
import {
	${child}
} from "${src.module}";

'''

[snippets.tname]
description = "one imported name, for timport's import list (data-driven: tname*@src.fns)"
body = '''
${value:name},
'''

[snippets.tfile]
description = "create <source>.test.js beside the --source file with a Jest test per exported fn/method (multi-file)"

[snippets.tfile.files.test]
path = "${src.dir}/${src.stem}.test.js"
on_exists = "create"
primary = true
expands = "(timport>tname*@src.fns?vis=public+tname*@src.types?vis=public)+tfn*@src.fns+tmeth*@src.methods"

[snippets.stub]
description = "method stub from an interface or abstract declaration (TypeScript: stub*@src.Shape.methods writes the required ones; ?all for every member)"
filter = "required"
scope = "fn-body"
body = '''
${value.decl:name()} {
	${child}
}
'''

# `|native`: a TypeScript spelling for a type written in another language —
# how `int:Point>field*` (TypeScript) mirrors a Rust struct or Python
# dataclass given `--source`. Declared here so TypeScript inherits it (and
# JSDoc in plain JavaScript can use it). Keys are foreign spellings only; a
# TypeScript type passes through.
[maps.native]
i8 = "number"
i16 = "number"
i32 = "number"
i64 = "number"
isize = "number"
u8 = "number"
u16 = "number"
u32 = "number"
u64 = "number"
usize = "number"
i128 = "bigint"
u128 = "bigint"
f32 = "number"
f64 = "number"
bool = "boolean"
String = "string"
str = "string"
"&str" = "string"
char = "string"
"()" = "void"
"Vec<u8>" = "Uint8Array"
"Vec<*>" = "*[]"
"HashSet<*>" = "Set<*>"
"BTreeSet<*>" = "Set<*>"
"HashMap<String, *>" = "Record<string, *>"
"HashMap<*, *>" = "Map<*, *>"
"BTreeMap<*, *>" = "Map<*, *>"
"Option<*>" = "* | null"
"Box<*>" = "*"
int = "number"
float = "number"
bytes = "Uint8Array"
None = "null"
"list[*]" = "*[]"
"set[*]" = "Set<*>"
"dict[str, *]" = "Record<string, *>"
"dict[*, *]" = "Map<*, *>"
"Optional[*]" = "* | null"
"* | None" = "* | null"
int8 = "number"
int16 = "number"
int32 = "number"
int64 = "number"
uint = "number"
uint8 = "number"
byte = "number"
uint16 = "number"
uint32 = "number"
uint64 = "number"
float32 = "number"
float64 = "number"
rune = "string"
error = "Error"
"[]byte" = "Uint8Array"
"[]*" = "*[]"
"map[string]*" = "Record<string, *>"
"map[*]*" = "Map<*, *>"
long = "number"
short = "number"
unsigned = "number"
"unsigned int" = "number"
"unsigned long" = "number"
"unsigned char" = "number"
double = "number"
size_t = "number"
int8_t = "number"
int16_t = "number"
int32_t = "number"
int64_t = "number"
uint8_t = "number"
uint16_t = "number"
uint32_t = "number"
uint64_t = "number"
"char*" = "string"
"const char*" = "string"
"std::string" = "string"
"std::vector<*>" = "*[]"
"std::optional<*>" = "* | null"
"std::unordered_map<std::string, *>" = "Record<string, *>"
"std::unordered_map<*, *>" = "Map<*, *>"
"std::map<*, *>" = "Map<*, *>"
"std::set<*>" = "Set<*>"
