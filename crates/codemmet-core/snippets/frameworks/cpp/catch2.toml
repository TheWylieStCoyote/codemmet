# Test framework pack: Catch2 (v3) for C++.
#
# Selected with `frameworks.cpp = "catch2"`. Replaces the GoogleTest bodies
# with `TEST_CASE` / `REQUIRE`; the same `tfn` / `tmeth` / `tfile` triggers.

[meta]
language = "cpp"
framework = "catch2"

[snippets.tfn]
description = "Catch2 TEST_CASE calling a function (data-driven: tfn*@src.fns, public by default)"
filter = "vis=public?!test"
requires = ["<catch2/catch_test_macros.hpp>"]
scope = "fn-body"
body = '''
TEST_CASE("${value} works${value.overload}") {
	REQUIRE(${value}(${value.args}) == ${1:expected});
}
'''

[snippets.tmeth]
description = "Catch2 TEST_CASE calling a method (data-driven: tmeth*@src.Type.methods)"
filter = "vis=public"
requires = ["<catch2/catch_test_macros.hpp>"]
scope = "fn-body"
body = '''
TEST_CASE("${value.owner}::${value} works${value.overload}") {
	${value.owner} subject$1;
	REQUIRE(subject.${value}(${value.args}) == ${2:expected});
}
'''

[[snippets.tmeth.variants]]
when = "ctor?!params"
body = '''
TEST_CASE("${value.owner} constructs${value.overload}") {
	${value.owner} subject;
	$0
}
'''

[[snippets.tmeth.variants]]
when = "ctor"
body = '''
TEST_CASE("${value.owner} constructs${value.overload}") {
	${value.owner} subject(${value.args});
	$0
}
'''

[[snippets.tmeth.variants]]
when = "static"
body = '''
TEST_CASE("${value.owner}::${value} works${value.overload}") {
	REQUIRE(${value.owner}::${value}(${value.args}) == ${1:expected});
}
'''
